<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tempo Examples</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky: #7dd3fc;
      --sun: #fde047;
      --grass: #86efac;
      --purple: #c084fc;
      --pink: #f9a8d4;
      --text: #1e293b;
      --white: #ffffff;
      --shadow: rgba(30, 41, 59, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Nunito", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, rgba(253, 224, 71, 0.55), transparent 28%),
        radial-gradient(circle at 85% 15%, rgba(249, 168, 212, 0.45), transparent 24%),
        linear-gradient(180deg, #bae6fd 0%, #e0f2fe 45%, #bbf7d0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .app {
      width: min(1120px, 100%);
      background: rgba(255, 255, 255, 0.92);
      border: 6px solid var(--white);
      border-radius: 28px;
      box-shadow: 0 24px 60px var(--shadow);
      padding: 20px 24px 22px;
      backdrop-filter: blur(8px);
    }

    .header {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin-bottom: 16px;
    }

    .logo {
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #0284c7, #9333ea, #db2777);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      font-size: clamp(0.95rem, 1.6vw, 1.1rem);
      font-weight: 700;
      color: #475569;
    }

    .player-card {
      background: linear-gradient(160deg, #f0f9ff, #fdf4ff);
      border: 4px solid #e2e8f0;
      border-radius: 22px;
      padding: 18px 20px 16px;
    }

    .player-layout {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 20px;
      align-items: center;
    }

    .controls-panel {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .artwork {
      width: 88px;
      height: 88px;
      flex-shrink: 0;
      border-radius: 18px;
      background:
        radial-gradient(circle at 30% 30%, var(--sun), transparent 35%),
        radial-gradient(circle at 70% 25%, var(--pink), transparent 30%),
        linear-gradient(135deg, var(--sky), var(--purple));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 0 4px rgba(255, 255, 255, 0.45);
    }

    .artwork-icon {
      font-size: 2.4rem;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.15));
      user-select: none;
    }

    .transport-panel {
      min-width: 0;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 1rem;
      font-weight: 800;
      color: #334155;
      margin-bottom: 8px;
    }

    .seek-wrap {
      position: relative;
      height: 24px;
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }

    .chapter-markers {
      position: relative;
      height: 10px;
      margin-bottom: 12px;
    }

    .chapter-marker {
      position: absolute;
      top: 0;
      width: 3px;
      height: 10px;
      border-radius: 999px;
      background: #94a3b8;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .chapters {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
    }

    .chapter-btn {
      border: 3px solid #e2e8f0;
      border-radius: 14px;
      background: var(--white);
      color: var(--text);
      padding: 10px 8px;
      font: inherit;
      font-size: 0.92rem;
      font-weight: 800;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 3px 0 #cbd5e1;
      transition: transform 0.08s ease, box-shadow 0.08s ease, border-color 0.12s ease, background 0.12s ease;
    }

    .chapter-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #cbd5e1;
    }

    .chapter-btn.active {
      border-color: #9333ea;
      background: linear-gradient(160deg, #f5f3ff, #fdf4ff);
      box-shadow: 0 3px 0 #7e22ce;
    }

    .chapter-btn-time {
      display: block;
      margin-top: 2px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #64748b;
    }

    .seek-track {
      position: absolute;
      left: 0;
      right: 0;
      height: 18px;
      border-radius: 999px;
      background: #cbd5e1;
      overflow: hidden;
      pointer-events: none;
    }

    .seek-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #0ea5e9, #a855f7);
      transition: width 0.05s linear;
    }

    .seek-input {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 24px;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }

    .seek-input::-webkit-slider-thumb {
      appearance: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--white);
      border: 4px solid #9333ea;
      box-shadow: 0 4px 14px rgba(147, 51, 234, 0.35);
    }

    .seek-input::-moz-range-thumb {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--white);
      border: 4px solid #9333ea;
      box-shadow: 0 4px 14px rgba(147, 51, 234, 0.35);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .side-btn {
      width: 64px;
      height: 64px;
      border: none;
      border-radius: 18px;
      background: var(--white);
      color: var(--text);
      font-size: 1.5rem;
      font-weight: 900;
      box-shadow: 0 6px 0 #cbd5e1, 0 10px 20px var(--shadow);
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    .side-btn:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #cbd5e1, 0 8px 16px var(--shadow);
    }

    .play-btn {
      width: 76px;
      height: 76px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(145deg, #22c55e, #16a34a);
      color: white;
      font-size: 2rem;
      box-shadow: 0 8px 0 #15803d, 0 12px 24px rgba(22, 163, 74, 0.35);
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .play-btn:active {
      transform: translateY(5px);
      box-shadow: 0 5px 0 #15803d, 0 10px 20px rgba(22, 163, 74, 0.35);
    }

    .play-btn.paused {
      background: linear-gradient(145deg, #f97316, #ea580c);
      box-shadow: 0 8px 0 #c2410c, 0 12px 24px rgba(234, 88, 12, 0.35);
    }

    .play-btn.paused:active {
      box-shadow: 0 4px 0 #c2410c, 0 8px 16px rgba(234, 88, 12, 0.35);
    }

    .hint {
      margin-top: 12px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 700;
      color: #64748b;
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1 class="logo">Tempo Examples</h1>
      <p class="subtitle">Explore tempo examples in the audio player.</p>
    </header>

    <section class="player-card" aria-label="Audio player">
      <div class="player-layout">
        <div class="controls-panel">
          <div class="artwork" aria-hidden="true">
            <span class="artwork-icon">🎵</span>
          </div>

          <div class="controls">
            <button class="side-btn" id="backBtn" type="button" aria-label="Go back 10 seconds">⏪</button>
            <button class="play-btn paused" id="playBtn" type="button" aria-label="Play">▶</button>
            <button class="side-btn" id="forwardBtn" type="button" aria-label="Go forward 10 seconds">⏩</button>
          </div>
        </div>

        <div class="transport-panel">
          <div class="time-row">
            <span id="currentTime" aria-live="polite">0:00</span>
            <span id="duration">0:00</span>
          </div>

          <div class="seek-wrap">
            <div class="seek-track" aria-hidden="true">
              <div class="seek-fill" id="seekFill"></div>
            </div>
            <input
              class="seek-input"
              id="seek"
              type="range"
              min="0"
              max="100"
              value="0"
              step="0.1"
              aria-label="Seek through track"
            >
          </div>

          <div class="chapter-markers" id="chapterMarkers" aria-hidden="true"></div>

          <div class="chapters" id="chapters" aria-label="Tempo example clips"></div>
        </div>
      </div>

      <p class="hint">Tap an example below, or drag the purple dot to jump anywhere.</p>
    </section>
  </main>

  <audio id="audio" preload="metadata">
    <source src="assets/tempo-examples.mp3" type="audio/mpeg">
    Your browser does not support audio playback.
  </audio>

  <script>
    const audio = document.getElementById("audio");
    const playBtn = document.getElementById("playBtn");
    const seek = document.getElementById("seek");
    const seekFill = document.getElementById("seekFill");
    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");
    const backBtn = document.getElementById("backBtn");
    const forwardBtn = document.getElementById("forwardBtn");
    const chaptersEl = document.getElementById("chapters");
    const chapterMarkersEl = document.getElementById("chapterMarkers");

    const chapters = [
      { label: "Example 1", start: 2.27, end: 30.24 },
      { label: "Example 2", start: 32.43, end: 89.97 },
      { label: "Example 3", start: 92.28, end: 119.97 },
      { label: "Example 4", start: 122.04, end: 149.63 },
      { label: "Example 5", start: 150.91, end: 179.98 },
      { label: "Example 6", start: 183.07, end: 210.29 },
    ];

    let isSeeking = false;
    let chapterButtons = [];

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${String(secs).padStart(2, "0")}`;
    }

    function updatePlayButton(playing) {
      playBtn.textContent = playing ? "⏸" : "▶";
      playBtn.classList.toggle("paused", !playing);
      playBtn.setAttribute("aria-label", playing ? "Pause" : "Play");
    }

    function getActiveChapterIndex(time) {
      return chapters.findIndex((chapter) => time >= chapter.start && time < chapter.end);
    }

    function updateActiveChapter() {
      const activeIndex = getActiveChapterIndex(audio.currentTime);
      chapterButtons.forEach((button, index) => {
        button.classList.toggle("active", index === activeIndex);
      });
    }

    function updateProgress() {
      if (!audio.duration) return;
      const percent = (audio.currentTime / audio.duration) * 100;
      seek.value = percent;
      seekFill.style.width = `${percent}%`;
      currentTimeEl.textContent = formatTime(audio.currentTime);
      updateActiveChapter();
    }

    function jumpToChapter(index) {
      const chapter = chapters[index];
      if (!chapter) return;
      audio.currentTime = chapter.start;
      updateProgress();
    }

    function renderChapters() {
      chaptersEl.innerHTML = "";
      chapterMarkersEl.innerHTML = "";
      chapterButtons = [];

      chapters.forEach((chapter, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "chapter-btn";
        button.innerHTML = `${chapter.label}<span class="chapter-btn-time">${formatTime(chapter.start)}</span>`;
        button.addEventListener("click", async () => {
          jumpToChapter(index);
          if (audio.paused) {
            try {
              await audio.play();
            } catch (error) {
              console.error(error);
            }
          }
        });
        chaptersEl.appendChild(button);
        chapterButtons.push(button);

        if (index > 0 && audio.duration) {
          const marker = document.createElement("span");
          marker.className = "chapter-marker";
          marker.style.left = `${(chapter.start / audio.duration) * 100}%`;
          chapterMarkersEl.appendChild(marker);
        }
      });
    }

    playBtn.addEventListener("click", async () => {
      if (audio.paused) {
        try {
          await audio.play();
        } catch (error) {
          console.error(error);
        }
      } else {
        audio.pause();
      }
    });

    backBtn.addEventListener("click", () => {
      audio.currentTime = Math.max(0, audio.currentTime - 10);
      updateProgress();
    });

    forwardBtn.addEventListener("click", () => {
      audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10);
      updateProgress();
    });

    seek.addEventListener("input", () => {
      isSeeking = true;
      const time = (seek.value / 100) * audio.duration;
      seekFill.style.width = `${seek.value}%`;
      currentTimeEl.textContent = formatTime(time);
    });

    seek.addEventListener("change", () => {
      audio.currentTime = (seek.value / 100) * audio.duration;
      isSeeking = false;
    });

    audio.addEventListener("loadedmetadata", () => {
      durationEl.textContent = formatTime(audio.duration);
      renderChapters();
      updateProgress();
    });

    audio.addEventListener("timeupdate", () => {
      if (!isSeeking) updateProgress();
    });

    audio.addEventListener("play", () => updatePlayButton(true));
    audio.addEventListener("pause", () => updatePlayButton(false));
    audio.addEventListener("ended", () => {
      updatePlayButton(false);
      seek.value = 0;
      seekFill.style.width = "0%";
      currentTimeEl.textContent = "0:00";
    });
  </script>
</body>
</html>
